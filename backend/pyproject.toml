[project]
name = "cek-invest-backend"
version = "1.0.0"
description = "CekInvest — AI Scam Intelligence Platform powered by SENTRA"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "uvicorn[standard]>=0.34.0",
    "google-genai>=2.0.1",
    "prisma>=0.15.0",
    # ── PRD Compliance additions ──────────────────────────────────────
    "upstash-redis>=1.1.0",         # Upstash Redis HTTP client (cache + rate limit)
    "python-whois>=0.9.5",          # WHOIS domain intelligence (Check #15-16)
    "feedparser>=6.0.11",           # RSS media search — Detik, Kompas, Tempo (Check #20)
    "beautifulsoup4>=4.12.3",       # OJK HTML scraping (Check #01-06)
    "lxml>=5.2.0",                  # Fast HTML parser for BeautifulSoup
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]  # do not perform function calls in argument defaults (FastAPI pattern)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
